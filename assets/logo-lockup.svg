<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="lockup-title lockup-desc">
  <title id="lockup-title">ceo-of-agents</title>
  <desc id="lockup-desc">The ceo-of-agents logo: the org-tree mark (a violet node for you, the CEO, above a teal node for the chief of staff, whose three branches land as commits on the teal hq git line) followed by the wordmark ceo-of-agents.</desc>

  <!-- Solid ink plate with a 1 px line border: looks the same on GitHub light and dark (identity 1.2). -->
  <rect x="0.5" y="0.5" width="759" height="199" rx="24" fill="#0F172A" stroke="#334155"/>

  <!-- Mark: logo-mark-dark.svg at 120 px tall (scale 120/584). x = CEO node diameter = 25.5 px here.
       Padding 40 px >= 1x on every side; gap mark to wordmark 38 px = 1.5x. -->
  <g transform="translate(40 40) scale(0.2054795) translate(-220 -223)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#64748B" stroke-width="24">
      <path d="M512 362 L512 434"/>
      <path d="M512 558 C512 636 312 612 312 688"/>
      <path d="M512 558 L512 688"/>
      <path d="M512 558 C512 636 712 612 712 688"/>
    </g>
    <g stroke="#2DD4BF" stroke-width="24">
      <path d="M232 736 L266 736"/>
      <path d="M358 736 L466 736"/>
      <path d="M558 736 L666 736"/>
      <path d="M758 736 L792 736"/>
      <circle cx="312" cy="736" r="44"/>
      <circle cx="512" cy="736" r="44"/>
      <circle cx="712" cy="736" r="44"/>
    </g>
    <circle cx="512" cy="496" r="62" fill="#2DD4BF"/>
    <circle cx="512" cy="300" r="62" fill="#A78BFA"/>
  </g>

  <!-- Wordmark: mono bold, paper on ink (17.06:1). Font size = 0.5 x mark height = 60 px.
       Live text in the system mono stack (identity 1.3, live SVG text). About 10% free width is left after the text for font differences.
       Baked into pixels (PNG, video): JetBrains Mono Bold, or outline it from JetBrains Mono Bold (engineering). -->
  <text x="198" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="60" font-weight="700" fill="#F8FAFC">ceo-of-agents</text>
</svg>
